<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Application Form</title>

    <style>

        body{
            margin: 0;
            font-family: Arial;
            background-color: #f4f4f4;
        }

        /* NAVBAR */

        nav{
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: black;
            padding: 20px;
        }

        .logo{
            color: white;
            font-size: 24px;
            font-weight: bold;
        }

        ul{
            display: flex;
            gap: 20px;
            list-style: none;
        }

        ul li a{
            color: white;
            text-decoration: none;
        }

        ul li a:hover{
            color: red;
        }

        /* FORM CONTAINER */

        .apply{
            display: flex;
            justify-content: center;
            margin-top: 60px;
        }

        /* FORM BOX */

        .form-box{
            background-color: white;
            width: 350px;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0px 0px 10px gray;
        }

        .form-box h2{
            text-align: center;
            margin-bottom: 30px;
        }

        .form-box label{
            font-weight: bold;
        }

        .form-box input{
            width: 100%;
            padding: 10px;
            margin-top: 8px;
            margin-bottom: 20px;
            border-radius: 10px;
            border: 1px solid gray;
            box-sizing: border-box;
        }

        .form-box button{
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 10px;
            background-color: black;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        .form-box button:hover{
            background-color: red;
        }

    </style>

</head>

<body>

    <!-- NAVBAR -->

    <nav>

        <div class="logo">MJ</div>

        <ul>
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
        </ul>

    </nav>

    <!-- APPLICATION FORM -->

    <div class="apply">

        <div class="form-box">

            <h2>Application Form</h2>

            <form onsubmit="submitForm(event)">

                <label>Name</label>
                <input type="text" required>

                <label>Aadhar Number</label>
                <input type="number" required>

                <label>Date of Birth</label>
                <input type="date" required>

                <label>State</label>
                <input type="text" required>

                <button type="submit">Submit</button>

                <h3 id="new"></h3>

            </form>

        </div>

    </div>

    <script>

        function submitForm(event){

            
            document.getElementById("new").textContent="success";
            alert("Form Submitted Successfully");

        }

    </script>

</body>
</html>
