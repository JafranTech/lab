<!DOCTYPE html>
<html>

<head>

    <title>Login and Signup</title>

    <style>

        body{
            font-family:Arial;
            background:#f2f2f2;
        }

        .box{
            width:300px;
            background:white;
            padding:20px;
            margin:50px auto;
            border-radius:10px;
        }

        input{
            width:100%;
            padding:10px;
            margin-top:10px;
        }

        button{
            width:100%;
            padding:10px;
            margin-top:15px;
            background:green;
            color:white;
            border:none;
        }

        a{
            text-decoration:none;
        }

    </style>

</head>

<body>

<!-- LOGIN PAGE -->

<div class="box" id="loginPage">

    <h2>Login Page</h2>

    <input type="text" id="loginUser"
    placeholder="Enter Username">

    <input type="password" id="loginPass"
    placeholder="Enter Password">

    <button onclick="login()">
        Login
    </button>

    <h3 id="loginMsg"></h3>

    <p>
        Don't have account ?
        <a href="#" onclick="showSignup()">
            Signup
        </a>
    </p>

</div>

<!-- SIGNUP PAGE -->

<div class="box" id="signupPage"
style="display:none;">

    <h2>Signup Page</h2>

    <input type="text" id="signupUser"
    placeholder="Create Username">

    <input type="password" id="signupPass"
    placeholder="Create Password">

    <button onclick="signup()">
        Signup
    </button>

    <h3 id="signupMsg"></h3>

    <p>
        Already have account ?
        <a href="#" onclick="showLogin()">
            Login
        </a>
    </p>

</div>

<script>

    // Show Signup Page

    function showSignup()
    {

        document.getElementById("loginPage")
        .style.display = "none";

        document.getElementById("signupPage")
        .style.display = "block";

    }

    // Show Login Page

    function showLogin()
    {

        document.getElementById("signupPage")
        .style.display = "none";

        document.getElementById("loginPage")
        .style.display = "block";

    }

    // Signup Validation

    function signup()
    {

        let user =
        document.getElementById("signupUser").value;

        let pass =
        document.getElementById("signupPass").value;

        if(user == "")
        {

            document.getElementById("signupMsg")
            .innerHTML = "Enter Username";

        }

        else if(pass == "")
        {

            document.getElementById("signupMsg")
            .innerHTML = "Enter Password";

        }

        else
        {

            document.getElementById("signupMsg")
            .innerHTML = "Signup Successful";

        }

    }

    // Login Validation

    function login()
    {

        let user =
        document.getElementById("loginUser").value;

        let pass =
        document.getElementById("loginPass").value;

        if(user == "")
        {

            document.getElementById("loginMsg")
            .innerHTML = "Enter Username";

        }

        else if(pass == "")
        {

            document.getElementById("loginMsg")
            .innerHTML = "Enter Password";

        }

        else
        {

            document.getElementById("loginMsg")
            .innerHTML = "Login Successful";

        }

    }

</script>

</body>
</html>
